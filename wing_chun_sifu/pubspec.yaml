name: wing_chun_sifu
description: "Wing Chun SiFu Online - storia, principi, forme e lezioni con il SiFu 3D"
publish_to: 'none'
# Il numero dopo il "+" e' il versionCode di Android: deve crescere a ogni
# APK consegnato, altrimenti il sistema rifiuta l'aggiornamento e mostra
# soltanto "App non installata", senza spiegare perche'.
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_3d_controller: ^2.3.0
  youtube_player_iframe: ^5.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
    - assets/lessons/
  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifTC-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
