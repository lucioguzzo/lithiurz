name: Build Signal Monitor APK

on:
  push:
    branches: ["**"]
    paths:
      - "signal-monitor/**"
      - ".github/workflows/build-signal-monitor.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: signal-monitor
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-monitor-debug-apk
          path: signal-monitor/app/build/outputs/apk/debug/app-debug.apk
