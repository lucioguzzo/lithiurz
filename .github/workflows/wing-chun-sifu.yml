name: Wing Chun SiFu Online

on:
  push:
    paths:
      - 'wing_chun_sifu/**'
      - '.github/workflows/wing-chun-sifu.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: wing_chun_sifu

jobs:
  verifica:
    name: Analisi, test e coerenza del modello 3D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install numpy pillow

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

      # Il modello 3D e' generato da codice: se qualcuno modifica le pose senza
      # rigenerare il .glb, l'app mostrerebbe una versione vecchia senza che
      # nessun test se ne accorga. Qui lo rigeneriamo e confrontiamo.
      - name: Il modello 3D e' allineato al suo generatore
        run: |
          cp assets/models/sifu.glb /tmp/sifu-committato.glb
          cp assets/data/lessons.json /tmp/lezioni-committate.json
          python3 tools/generate_sifu_model.py
          if ! cmp -s /tmp/sifu-committato.glb assets/models/sifu.glb; then
            echo "::error::sifu.glb non corrisponde all'output di tools/generate_sifu_model.py — rigeneralo e committa il risultato"
            exit 1
          fi
          if ! cmp -s /tmp/lezioni-committate.json assets/data/lessons.json; then
            echo "::error::lessons.json non corrisponde al generatore — rigeneralo e committa il risultato"
            exit 1
          fi
          echo "Modello e indice delle lezioni allineati."

      - name: Verifica delle posizioni Wing Chun
        run: python3 tools/verify_poses.py

  android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: verifica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compila l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wing-chun-sifu-apk
          path: wing_chun_sifu/build/app/outputs/flutter-apk/app-release.apk

      - name: Compila gli App Bundle per il Play Store
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: wing-chun-sifu-aab
          path: wing_chun_sifu/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: Build iOS (senza firma)
    runs-on: macos-latest
    needs: verifica
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Senza certificato di sviluppo non si puo' firmare: questa build
      # verifica comunque che il progetto iOS compili e che i pod si risolvano.
      - name: Compila per iOS
        run: flutter build ios --release --no-codesign

      - name: Impacchetta l'app non firmata
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr WingChunSiFu-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: wing-chun-sifu-ios-unsigned
          path: wing_chun_sifu/build/ios/iphoneos/WingChunSiFu-unsigned.ipa
