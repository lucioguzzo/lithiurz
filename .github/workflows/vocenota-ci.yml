name: VoceNota CI

on:
  push:
    branches: [main, master, 'ccr-**']
    paths:
      - 'vocenota/**'
      - 'backend/**'
      - '.github/workflows/vocenota-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: App Flutter (analisi, test, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocenota
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test unitari
        run: flutter test --reporter expanded

      - name: APK di debug
        run: flutter build apk --debug

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: vocenota-debug-apk
          path: vocenota/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  backend:
    name: Backend FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dipendenze
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Immagine Docker (solo verifica)
        run: docker build -t vocenota-backend:ci .
