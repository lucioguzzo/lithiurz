name: SyncAudio APK

on:
  push:
    paths:
      - "syncaudio/**"
      - ".github/workflows/syncaudio-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syncaudio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test motore di sincronizzazione
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: syncaudio-apk
          path: syncaudio/app/build/outputs/apk/debug/app-debug.apk
