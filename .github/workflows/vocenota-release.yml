name: VoceNota — APK di release

# Produce un APK installabile a mano. Senza i segreti di firma viene usata
# la chiave di debug: l'APK si installa sul telefono ma NON è pubblicabile.

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "URL del backend dei riassunti (vuoto = solo locale)"
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocenota
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ripristina il keystore (se configurato)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Nessun keystore configurato: l'APK sarà firmato con la chiave di debug e NON è pubblicabile."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: APK di release (uno per architettura)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=VOCENOTA_BACKEND_URL=${{ github.event.inputs.backend_url }} \
            --dart-define=VOCENOTA_APP_TOKEN=${{ secrets.VOCENOTA_APP_TOKEN }} \
            --dart-define=ADMOB_BANNER_ANDROID=${{ secrets.ADMOB_BANNER_ANDROID }}

      - uses: actions/upload-artifact@v4
        with:
          name: vocenota-release-apk
          path: vocenota/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
